[package]
name = "velo_ast_macro"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for velo_ast — the shared, serializable view AST (backend-safe, no WASM deps)."
license = "MIT"
repository = "https://github.com/digiator42/Velo"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dependencies.velo_ast]
version = "0.1.0"
path = "../ast"
