<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mview Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.5; }
        .dashboard { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 64px 1fr; min-height: 100vh; transition: background 0.2s, color 0.2s; }
        .dashboard.dark { background: #0f172a; color: #f1f5f9; }
        .dashboard-header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .dashboard.dark .dashboard-header { background: #1e293b; border-bottom-color: #334155; }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .hamburger { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; border-radius: 0.5rem; }
        .hamburger:hover { background: #f1f5f9; }
        .dashboard.dark .hamburger:hover { background: #334155; }
        .logo { font-size: 1.25rem; font-weight: 700; color: #3b82f6; }
        .header-center { flex: 1; max-width: 600px; margin: 0 2rem; }
        .search-input { width: 100%; padding: 0.5rem 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; background: #f8fafc; }
        .dashboard.dark .search-input { background: #1e293b; border-color: #334155; color: #f1f5f9; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .theme-toggle { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.5rem; border-radius: 0.5rem; }
        .theme-toggle:hover { background: #f1f5f9; }
        .dashboard.dark .theme-toggle:hover { background: #334155; }
        .theme-toggle.active { background: #dbeafe; }
        .dashboard.dark .theme-toggle.active { background: #1e3a5f; }
        .notification-bell { position: relative; background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.5rem; border-radius: 0.5rem; }
        .notification-bell:hover { background: #f1f5f9; }
        .dashboard.dark .notification-bell:hover { background: #334155; }
        .notification-bell.has-notifications { color: #ef4444; }
        .badge-count { position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; font-size: 0.625rem; font-weight: 700; padding: 2px 5px; border-radius: 9999px; min-width: 16px; text-align: center; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.875rem; }
        .sidebar { grid-row: 2; background: white; border-right: 1px solid #e2e8f0; padding: 1.5rem; overflow-y: auto; transition: all 0.3s ease; }
        .dashboard.dark .sidebar { background: #1e293b; border-right-color: #334155; }
        .sidebar.closed { width: 0; padding: 1.5rem 0; overflow: hidden; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-section h3 { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.75rem; }
        .tab-button, .action-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border: none; background: none; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; color: #475569; cursor: pointer; text-align: left; transition: all 0.2s; }
        .tab-button:hover, .action-btn:hover { background: #f1f5f9; color: #1e293b; }
        .dashboard.dark .tab-button:hover, .dashboard.dark .action-btn:hover { background: #334155; color: #f1f5f9; }
        .tab-button.active { background: #dbeafe; color: #3b82f6; font-weight: 600; }
        .dashboard.dark .tab-button.active { background: #1e3a5f; color: #60a5fa; }
        .status-filter { width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; background: white; color: #1e293b; }
        .dashboard.dark .status-filter { background: #1e293b; border-color: #334155; color: #f1f5f9; }
        .dashboard-main { padding: 1.5rem; overflow-y: auto; }
        .tab-content { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .metric-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.5rem; transition: box-shadow 0.2s; }
        .dashboard.dark .metric-card { background: #1e293b; border-color: #334155; }
        .metric-card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .metric-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .metric-icon { font-size: 1.5rem; }
        .metric-label { font-size: 0.875rem; font-weight: 500; color: #64748b; }
        .metric-value { font-size: 2rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
        .dashboard.dark .metric-value { color: #f1f5f9; }
        .metric-change { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; }
        .metric-change.trend-up { color: #10b981; }
        .metric-change.trend-down { color: #ef4444; }
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .chart-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.5rem; }
        .dashboard.dark .chart-card { background: #1e293b; border-color: #334155; }
        .chart-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #1e293b; }
        .dashboard.dark .chart-card h3 { color: #f1f5f9; }
        .chart-bars { display: flex; align-items: flex-end; gap: 1rem; height: 200px; }
        .chart-bars.large { height: 300px; }
        .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .bar-fill { width: 100%; border-radius: 4px 4px 0 0; transition: height 0.3s ease; }
        .bar-label { font-size: 0.75rem; color: #64748b; }
        .bar-value { font-size: 0.875rem; font-weight: 600; color: #1e293b; }
        .dashboard.dark .bar-value { color: #f1f5f9; }
        .activity-feed { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.5rem; }
        .dashboard.dark .activity-feed { background: #1e293b; border-color: #334155; }
        .activity-feed h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .activity-item { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #e2e8f0; }
        .dashboard.dark .activity-item { border-bottom-color: #334155; }
        .activity-item:last-child { border-bottom: none; padding-bottom: 0; }
        .activity-icon { font-size: 1.5rem; flex-shrink: 0; }
        .activity-content { flex: 1; }
        .activity-user { font-weight: 600; color: #1e293b; margin-bottom: 0.25rem; }
        .dashboard.dark .activity-user { color: #f1f5f9; }
        .activity-action { color: #64748b; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .activity-time { font-size: 0.75rem; color: #94a3b8; }
        .orders-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .orders-header h2 { font-size: 1.25rem; font-weight: 700; }
        .count { font-size: 0.875rem; color: #64748b; }
        .data-table-container { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; overflow-x: auto; }
        .dashboard.dark .data-table-container { background: #1e293b; border-color: #334155; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; }
        .dashboard.dark .data-table th, .dashboard.dark .data-table td { border-bottom-color: #334155; }
        .data-table th { background: #f8fafc; font-weight: 600; color: #475569; cursor: pointer; user-select: none; white-space: nowrap; }
        .dashboard.dark .data-table th { background: #1e293b; color: #94a3b8; }
        .data-table th:hover { background: #f1f5f9; }
        .dashboard.dark .data-table th:hover { background: #334155; }
        .data-table tr:hover td { background: #f8fafc; }
        .dashboard.dark .data-table tr:hover td { background: #1e293b; }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-processing { background: #dbeafe; color: #1e40af; }
        .badge-shipped { background: #e0e7ff; color: #3730a3; }
        .badge-delivered { background: #dcfce7; color: #166534; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
        .analytics-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.5rem; }
        .dashboard.dark .analytics-card { background: #1e293b; border-color: #334155; }
        .analytics-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .status-distribution { display: flex; flex-direction: column; gap: 1rem; }
        .status-bar { display: flex; align-items: center; gap: 1rem; }
        .status-bar span:first-child { width: 100px; font-size: 0.875rem; font-weight: 500; color: #475569; }
        .bar-container { flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .dashboard.dark .bar-container { background: #334155; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
        .activity-list { display: flex; flex-direction: column; gap: 1rem; }
        @media (max-width: 1024px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: 0; top: 64px; bottom: 0; z-index: 50; width: 280px; transform: translateX(-100%); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
            .sidebar.open { transform: translateX(0); }
            .sidebar.closed { width: 280px; padding: 1.5rem; overflow-y: auto; }
            .hamburger { display: flex; }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
            .sidebar-overlay.open { display: block; }
        }
        .status-bar span:last-child { width: 60px; text-align: right; font-size: 0.75rem; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import init, { start } from './mview_dashboard.js';
        await init();
        start();
    </script>
</body>
</html>
